<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Scrollower</title>
    <link
      rel="stylesheet"
      href="popup.css" />
  </head>

  <body>
    <div class="container">
      <header class="header">
        <div class="brand-icon">◎</div>

        <div>
          <h2>Scrollower</h2>
          <p>Instagram Automation</p>
        </div>
      </header>

      <div class="action-switcher">
        <button
          class="action-tab active"
          data-action="follow">
          Follow
        </button>

        <button
          class="action-tab"
          data-action="unfollow">
          Unfollow
        </button>
      </div>

      <!-- Follow -->

      <section
        class="action-panel"
        id="follow-panel">
        <h3>Follow users</h3>

        <div class="control">
          <div class="control-header">
            <label for="follow-limit">Limit</label>
            <span id="follow-limit-value">100</span>
          </div>

          <input
            type="range"
            id="follow-limit"
            min="50"
            max="500"
            step="10"
            value="100" />
        </div>

        <div class="control">
          <div class="control-header">
            <label for="follow-delay">Delay</label>
            <span id="follow-delay-value">5s</span>
          </div>

          <input
            type="range"
            id="follow-delay"
            min="0.5"
            max="30"
            step="0.5"
            value="5" />
        </div>

        <button
          id="start-follow"
          class="primary-button">
          Start Following
        </button>
      </section>

      <!-- Unfollow -->

      <section
        class="action-panel hidden"
        id="unfollow-panel">
        <h3>Unfollow users</h3>

        <div class="control">
          <div class="control-header">
            <label for="unfollow-limit">Limit</label>
            <span id="unfollow-limit-value">100</span>
          </div>

          <input
            type="range"
            id="unfollow-limit"
            min="50"
            max="500"
            step="10"
            value="100" />
        </div>

        <div class="control">
          <div class="control-header">
            <label for="unfollow-delay">Delay</label>
            <span id="unfollow-delay-value">10s</span>
          </div>

          <input
            type="range"
            id="unfollow-delay"
            min="0.5"
            max="30"
            step="0.5"
            value="10" />
        </div>

        <button
          id="start-unfollow"
          class="primary-button">
          Start Unfollowing
        </button>
      </section>

      <div class="status">
        <span class="status-dot"></span>
        <span id="status">Ready</span>
      </div>

      <button
        id="stop"
        class="stop-button">
        Stop Script
      </button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
