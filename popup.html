<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Div Auto Scroll</title>
    <link
      rel="stylesheet"
      href="popup.css" />
  </head>

  <body>
    <div class="container">
      <h2>Div Auto Scroll</h2>

      <label for="selector">CSS Selector</label>

      <input
        id="selector"
        type="text"
        placeholder=".chat-container" />

      <label for="speed">Speed</label>

      <div class="speed-row">
        <input
          id="speed"
          type="range"
          min="10"
          max="500"
          value="100" />

        <span id="speedValue">100</span>
      </div>

      <div class="buttons">
        <button id="start">Start</button>
        <button id="stop">Stop</button>
      </div>

      <div id="status"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
