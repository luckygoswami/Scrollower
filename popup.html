<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Scrollower</title>
    <link
      rel="stylesheet"
      href="popup.css" />
  </head>

  <body>
    <div class="container">
      <h2>Scrollower</h2>

      <div class="buttons">
        <button id="start">Start</button>
        <button id="stop">Stop</button>
      </div>
      <div class="follow-range">
        <label for="followLimit">Follow Limit</label>
        <input
          id="followLimit"
          type="range"
          min="100"
          max="1000"
          step="100"
          value="300" />

        <span id="followLimitValue">300</span>
      </div>

      <div id="status"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
